<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - TamuTalk</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-p1CmXU4ieA+fKt/acZZPngOwPAn5LBJ4wL+qez8UYRD2hM6iSvLg8RYEpvuQ/rtwY1Xsqz+GWG+Xcz+me+m2Kg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- Your CSS -->
  <link rel="stylesheet" href="static/css/styles.css">
</head>

<body class="signin-page">
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container">
      <div class="logo">
        <img src="/static/images/chef-hat-icon-1024x1022-eu55o6pc.png" alt="Logo Icon" class="logo-icon" />
        <span class="logo-text">TamuTalk</span>
      </div>
      <nav>
        <a href="/" class="nav-link active">Home</a>
        <a href="/login" class="nav-link">Dashboard</a>
      </nav>
      <div class="auth">
        <a href="/login" class="btn-outline">Sign In</a>
        <a href="/signup" class="btn-primary">Get Started</a>
      </div>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="container">
      <div class="hero-content">
        <h1>Join TamuTalk Today!</h1>
      </div>
      <div class="card">
        <form id="signup-form" class="form-grid" method="POST">
          <div class="form-group input-icon">
            <label>First Name</label>
            <i class="fas fa-user"></i>
            <input type="text" name="first_name" placeholder="John" required />
          </div>
          <div class="form-group input-icon">
            <label>Last Name</label>
            <i class="fas fa-user"></i>
            <input type="text" name="last_name" placeholder="Doe" required />
          </div>
          <div class="form-group input-icon">
            <label>Email</label>
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" placeholder="your.email@example.com" required />
          </div>
          <div class="form-group input-icon">
            <label>Password</label>
            <i class="fas fa-key"></i>
            <input type="password" name="user_password" placeholder="••••••••" required />
          </div>
          <div class="form-group input-icon">
            <label for="gender">Gender</label>
            <i class="fas fa-venus-mars"></i>
            <select name="gender" required>
              <option value="" disabled selected>Select gender</option>
              <option value="Male">male</option>
              <option value="Female">female</option>
            </select>
          </div>
          <div class="form-group input-icon">
            <label for="date_of_birth">Date of Birth</label>
            <i class="fas fa-calendar-alt"></i>
            <input type="date" id="date_of_birth" name="date_of_birth" required />
          </div> 
          <button class="btn">Register</button>
        </form>
      </div>
      <div class="signup">
        Already have an account? <a href="/login">Sign in</a>
      </div>

      <div class="divider">
        <span>OR</span>
      </div>

      <div class="social-buttons">
        <button class="btn-google"><img src="/static/images/OIP (7).jpeg" alt="Google" /></button>
        <button class="btn-github"><img src="/static/images/github.svg" alt="GitHub" /></button>
      </div>
    </div>
  </section>
  <script src="/static/js/signup.js"></script>
</body>

</html>
